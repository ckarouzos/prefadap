max_grad_norm: 0.5
bf16: true
fp16: false
learning_rate: 1.0e-06
# Explicit training epochs for GRPO runs.
num_train_epochs: 1
# Canonical GRPO template mirroring PPO defaults with group-specific slots.
experiment_type: grpo
gradient_checkpointing: true
rl:
  shared:
    response_length: 48
    local_rollout_forward_batch_size: 32
    num_mini_batches: 2
    ds3_gather_for_generation: false
    temperature: 1.0
    top_p: 0.95
    stop_token: eos
description: Group Relative Preference Optimisation baseline with canonical hyperparameters.
reward_model_name_or_path: null
beta: 0.1
ppo_epochs: 1
vf_coef: 0.05
entropy_coef: 0.01
clip_range: 0.1
per_device_train_batch_size: 64
gradient_accumulation_steps: 1
group_size: 4
group_field: null
fairness_metric: min_ratio
