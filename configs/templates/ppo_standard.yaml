# Canonical PPO template exposing RLHF-specific knobs for grid generators.
max_grad_norm: 0.5
bf16: true
fp16: false
learning_rate: 1.0e-06
experiment_type: ppo
gradient_checkpointing: true
rl:
  shared:
    response_length: 48
    local_rollout_forward_batch_size: 32
    num_mini_batches: 2
    ds3_gather_for_generation: false
    temperature: 1.0
    top_p: 0.95
    stop_token: eos
  ppo:
    target_kl: 0.10
    kl_coef: 0.10
    cliprange: 0.10
    cliprange_value: 0.10
    vf_coef: 0.05
    whiten_rewards: true
    kl_estimator: k3
    gamma: 0.99
    lam: 0.9
description: Proximal Policy Optimisation baseline with canonical hyperparameters.
# Reward model path is intentionally left null for experiment-specific overrides.
reward_model_name_or_path: null
beta: 0.1
target_kl: 0.01
vf_coef: 0.05
entropy_coef: 0.01
clip_range: 0.1
per_device_train_batch_size: 64
gradient_accumulation_steps: 1
num_train_epochs: 1
